<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Расписание</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="header-top">
                <div class="header-title">
                    <span class="uni-badge">ГУУ</span>
                    <h1>Расписание</h1>
                </div>
            </div>
            <div class="group-tabs">
                <button class="tab active" data-group="БИ 2-3">БИ 2-3</button>
            </div>
        </div>

        <div class="week-selector">
            <button class="week-arrow" id="prevWeek">‹</button>
            <div class="week-info">
                <div class="week-month" id="weekMonth">Август — Сентябрь</div>
                <div class="week-type" id="weekType">Нечётная</div>
                <div class="week-range" id="weekRange">31 авг — 6 сен · 1-я неделя</div>
            </div>
            <button class="week-arrow" id="nextWeek">›</button>
        </div>

        <div class="days-strip" id="daysStrip">
            <div class="day active" data-day="0">
                <span class="day-name">ПН</span>
                <span class="day-num">31</span>
            </div>
            <div class="day" data-day="1">
                <span class="day-name">ВТ</span>
                <span class="day-num">1</span>
            </div>
            <div class="day" data-day="2">
                <span class="day-name">СР</span>
                <span class="day-num">2</span>
            </div>
            <div class="day" data-day="3">
                <span class="day-name">ЧТ</span>
                <span class="day-num">3</span>
            </div>
            <div class="day" data-day="4">
                <span class="day-name">ПТ</span>
                <span class="day-num">4</span>
            </div>
            <div class="day" data-day="5">
                <span class="day-name">СБ</span>
                <span class="day-num">5</span>
            </div>
            <div class="day" data-day="6">
                <span class="day-name">ВС</span>
                <span class="day-num">6</span>
            </div>
        </div>

        <div class="schedule-content" id="scheduleContent"></div>

        <div class="bottom-nav">
            <button class="nav-item active" data-page="schedule">
                <span class="nav-icon">📅</span>
                <span class="nav-label">Расписание</span>
            </button>
            <button class="nav-item" data-page="sport">
                <span class="nav-icon">🏋️</span>
                <span class="nav-label">Спорт</span>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
