<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Расписание</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <div class="header-title">
                    <span class="uni-badge">ГУУ</span>
                    <h1>Расписание</h1>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="editBtn">✏️</button>
                    <button class="icon-btn" id="calendarBtn">📅</button>
                </div>
            </div>

            <!-- Group Tabs -->
            <div class="group-tabs">
                <button class="tab active" data-group="БИ 1-3">БИ 1-3</button>
                <button class="tab" data-group="БИ 2-3">БИ 2-3</button>
                <button class="tab" data-group="БИ 1-2">БИ 1-2</button>
                <button class="tab add-tab">+</button>
            </div>
        </div>

        <!-- Week Selector -->
        <div class="week-selector">
            <button class="week-arrow" id="prevWeek">‹</button>
            <div class="week-info">
                <div class="week-month" id="weekMonth">Август — Сентябрь</div>
                <div class="week-type" id="weekType">Чётная</div>
                <div class="week-range" id="weekRange">31 авг — 6 сен · 30-я неделя</div>
            </div>
            <button class="week-arrow" id="nextWeek">›</button>
        </div>

        <!-- Days Strip -->
        <div class="days-strip" id="daysStrip">
            <div class="day active" data-day="0">
                <span class="day-name">ПН</span>
                <span class="day-num">31</span>
            </div>
            <div class="day" data-day="1">
                <span class="day-name">ВТ</span>
                <span class="day-num">1</span>
            </div>
            <div class="day" data-day="2">
                <span class="day-name">СР</span>
                <span class="day-num">2</span>
            </div>
            <div class="day" data-day="3">
                <span class="day-name">ЧТ</span>
                <span class="day-num">3</span>
            </div>
            <div class="day" data-day="4">
                <span class="day-name">ПТ</span>
                <span class="day-num">4</span>
            </div>
            <div class="day" data-day="5">
                <span class="day-name">СБ</span>
                <span class="day-num">5</span>
            </div>
            <div class="day" data-day="6">
                <span class="day-name">ВС</span>
                <span class="day-num">6</span>
            </div>
        </div>

        <!-- Schedule Content -->
        <div class="schedule-content" id="scheduleContent">
            <!-- Content will be injected by JS -->
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <button class="nav-item active" data-page="schedule">
                <span class="nav-icon">📅</span>
                <span class="nav-label">Расписание</span>
            </button>
            <button class="nav-item" data-page="sport">
                <span class="nav-icon">🏋️</span>
                <span class="nav-label">Спорт</span>
            </button>
            <button class="nav-item" data-page="other">
                <span class="nav-icon">⊞</span>
                <span class="nav-label">Другое</span>
            </button>
            <button class="nav-item" data-page="profile">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Профиль</span>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
